name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "content/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate required pages
        run: |
          test -f CNAME
          test -f puissance-capacite/station-electrique-1000wh/index.html
          test -f puissance-capacite/station-electrique-2000wh/index.html
          test -f puissance-capacite/station-electrique-2000w/index.html
          grep -q 'id="autonomie"' puissance-capacite/station-electrique-1000wh/index.html
          grep -q 'id="autonomie"' puissance-capacite/station-electrique-2000wh/index.html
          grep -q 'id="demarrage"' puissance-capacite/station-electrique-2000w/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
