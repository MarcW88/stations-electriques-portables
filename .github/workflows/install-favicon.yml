name: Install site favicon
on:
  push:
    branches: [main]
    paths:
      - favicon.svg
      - scripts/install_favicon.py
      - .github/workflows/install-favicon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and validate favicon site-wide
        run: python scripts/install_favicon.py
      - name: Publish to main
        run: |
          git config user.name "Marc Williame"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(branding): integrate favicon across public pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
