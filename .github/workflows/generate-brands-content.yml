name: Generate brand content

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - content/marques-workflow
      - adapt-brand-workflows-stations
    paths:
      - '.agents/skills/brand-content-workflow/**'
      - '.agents/skills/brand-analysis-workflow/**'
      - '.content/brands/**'
      - '.content/brand-pages/**'
      - '.content/brand-audits/**'
      - '.content/briefs/marques-production-2026-09-09.md'
      - '.content/reviews/marques-production-qa.md'
      - 'brand-workflow.config.yaml'
      - '_generate_brands.py'
      - '_validate_brands.py'
      - 'style.css'
      - 'brand.css'
      - 'marques/**'
      - '.github/workflows/generate-brands-content.yml'
  pull_request:
    paths:
      - '.agents/skills/brand-content-workflow/**'
      - '.agents/skills/brand-analysis-workflow/**'
      - '.content/brands/**'
      - '.content/brand-pages/**'
      - '.content/brand-audits/**'
      - 'brand-workflow.config.yaml'
      - '_generate_brands.py'
      - '_validate_brands.py'
      - 'style.css'
      - 'brand.css'
      - 'marques/**'
      - '.github/workflows/generate-brands-content.yml'

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site shell
        run: python _generate.py

      - name: Restore researched guides
        run: python _generate_guides.py

      - name: Restore researched comparisons
        run: python _generate_comparatifs.py

      - name: Generate brand hub and seven brand pages
        run: python _generate_brands.py

      - name: Run repo-specific hard brand invariants
        run: python _validate_brands.py

      - name: Check brand design hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = sorted(Path('marques').glob('*/index.html'))
          hub = Path('marques/index.html')
          assert 'class="brand-hub-page"' in hub.read_text(encoding='utf-8'), hub
          for p in pages:
              s = p.read_text(encoding='utf-8')
              assert 'class="brand-page"' in s, p
              assert 'class="brand-mobile-toc"' in s, p
              assert 'class="brand-sources"' in s, p
              assert 'class="table-wrap"' not in s, p
          print('PASS: brand-only design hooks present')
          PY

      - name: Check idempotence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          pages = [Path('marques/index.html'), *sorted(Path('marques').glob('*/index.html'))]
          before = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in pages}
          subprocess.run(['python', '_generate_brands.py'], check=True)
          after = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in pages}
          changed = [p for p in before if before[p] != after[p]]
          if changed:
              raise SystemExit('Non-idempotent: ' + ', '.join(changed))
          print('PASS: brand generation is idempotent')
          PY

      - name: Preserve noindex
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [Path('marques/index.html'), *Path('marques').glob('*/index.html')]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              assert re.search(r'name="robots"\s+content="noindex,\s*follow"', s, re.I), p
          print('PASS: noindex, follow preserved')
          PY

      - name: Check guides and comparisons unchanged
        run: git diff --exit-code -- guides/ comparatifs/

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated brand HTML
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marques/index.html marques/*/index.html
          if git diff --cached --quiet; then
            echo 'No rendered changes to commit'
          else
            git commit -m '[skip ci] Render researched brand hubs'
            git push
          fi
