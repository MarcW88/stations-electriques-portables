name: Visual design review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - 'marques/**'
      - 'comparatifs/**'
      - 'usages/**'
      - 'bons-plans/**'
      - 'style.css'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.agents/skills/site-design-review/**'
      - '.github/workflows/visual-design-review.yml'
  pull_request:
    paths:
      - 'guides/**'
      - 'marques/**'
      - 'comparatifs/**'
      - 'usages/**'
      - 'bons-plans/**'
      - 'style.css'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.agents/skills/site-design-review/**'
      - '.github/workflows/visual-design-review.yml'

permissions:
  contents: write

jobs:
  visual-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Confirm actual Chromium launch
        run: node -e "import('@playwright/test').then(async ({chromium}) => { const b = await chromium.launch({headless:true}); console.log('CHROMIUM_SMOKE_PASS', b.version()); await b.close(); })"
      - name: Audit all guides in desktop and mobile
        run: npm run visual:guides -- --output .artifacts/design-review/guides
      - name: Publish audit verification to repository
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p audit-results/guides
          cp .artifacts/design-review/guides/report.json audit-results/guides/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/guides/report.json
          git diff --cached --quiet || (git commit -m 'chore(audit): save verified guides Playwright report [skip ci]' && git push)
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guides-design-review
          path: .artifacts/design-review/guides/
          if-no-files-found: warn
          retention-days: 14
