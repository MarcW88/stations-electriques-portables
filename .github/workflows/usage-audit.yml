name: Usage cluster QA
on:
  push:
    branches: [main]
    paths:
      - '_generate.py'
      - 'usage_*_content.py'
      - 'usages/**'
      - 'scripts/validate_usage_cluster.py'
      - '.github/workflows/usage-audit.yml'
  workflow_dispatch:
jobs:
  usage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original agent files
        run: python3 scripts/verify_site_agents.py
      - name: Compile source files
        run: python3 -m py_compile _generate.py usage_*_content.py scripts/validate_usage_cluster.py
      - name: Generate and validate pages
        run: |
          python3 _generate.py
          python3 scripts/validate_usage_cluster.py
