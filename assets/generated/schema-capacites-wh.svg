<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><title>Capacité nominale et énergie utilisable : exemples de calcul</title><rect width="1100" height="420" rx="22" fill="#f7faf9"/><g font-family="Arial" fill="#193b4b"><text x="55" y="62" font-size="30" font-weight="bold">Comparer les capacités en Wh</text><text x="55" y="97" font-size="18">Illustration avec 85 % d'énergie utilisable (hypothèse, non mesure)</text><text x="68" y="169" font-size="22">500 Wh</text><text x="68" y="249" font-size="22">1 000 Wh</text><text x="68" y="329" font-size="22">2 000 Wh</text></g><rect x="230" y="138" width="170" height="42" rx="7" fill="#91b9c8"/><rect x="230" y="218" width="340" height="42" rx="7" fill="#62a7a8"/><rect x="230" y="298" width="680" height="42" rx="7" fill="#367e7d"/><g font-family="Arial" font-size="19" fill="#17394a"><text x="415" y="167">425 Wh utiles</text><text x="585" y="247">850 Wh utiles</text><text x="925" y="327">1 700 Wh utiles</text><text x="55" y="393" font-size="18">Autonomie = Wh utilisables / consommation moyenne en W. Vérifier rendement réel de la station.</text></g></svg>