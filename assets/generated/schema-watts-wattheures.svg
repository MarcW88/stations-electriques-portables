<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370"><title>Différence entre puissance en watts et énergie en wattheures</title><rect width="1100" height="370" rx="22" fill="#f5faf8"/><g font-family="Arial" fill="#163747"><rect x="60" y="72" width="440" height="205" rx="20" fill="#dcecf8"/><rect x="600" y="72" width="440" height="205" rx="20" fill="#e1f0e8"/><text x="280" y="125" font-size="46" font-weight="bold" text-anchor="middle">W</text><text x="820" y="125" font-size="46" font-weight="bold" text-anchor="middle">Wh</text><text x="280" y="165" font-size="25" text-anchor="middle">Puissance instantanée</text><text x="820" y="165" font-size="25" text-anchor="middle">Énergie disponible</text><text x="280" y="218" font-size="20" text-anchor="middle">Quels appareils simultanés ?</text><text x="820" y="218" font-size="20" text-anchor="middle">Pendant combien de temps ?</text><text x="550" y="324" font-size="23" text-anchor="middle">Autonomie théorique = énergie utilisable (Wh) ÷ puissance moyenne (W)</text></g></svg>