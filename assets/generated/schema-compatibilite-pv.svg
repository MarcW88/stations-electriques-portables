<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>Vérification des quatre limites de compatibilité photovoltaïque</title><rect width="1100" height="400" rx="22" fill="#f5faf8"/><text x="55" y="63" font-family="Arial" font-size="30" fill="#193e49" font-weight="bold">Avant de brancher un panneau à une station</text><g font-family="Arial" font-size="22" fill="#193e49"><rect x="55" y="105" width="465" height="100" rx="14" fill="#dcecf8"/><text x="80" y="144" font-weight="bold">1. Tension à vide (Voc)</text><text x="80" y="174" font-size="18">Respecter la tension PV maximale, même à froid</text><rect x="575" y="105" width="465" height="100" rx="14" fill="#e3f1e9"/><text x="600" y="144" font-weight="bold">2. Plage de fonctionnement</text><text x="600" y="174" font-size="18">Vmp compatible avec la plage MPPT</text><rect x="55" y="235" width="465" height="100" rx="14" fill="#e3f1e9"/><text x="80" y="274" font-weight="bold">3. Courant et puissance</text><text x="80" y="304" font-size="18">Respecter les limites d'entrée documentées</text><rect x="575" y="235" width="465" height="100" rx="14" fill="#dcecf8"/><text x="600" y="274" font-weight="bold">4. Connectique et polarité</text><text x="600" y="304" font-size="18">Vérifier les câbles prévus par le fabricant</text></g></svg>