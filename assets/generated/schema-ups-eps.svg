<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><title>Chronologie schématique d'une bascule de secteur vers batterie</title><rect width="1000" height="370" rx="20" fill="#f7faf9"/><text x="55" y="58" font-family="Arial" font-size="28" font-weight="bold" fill="#1b3a44">Coupure secteur et basculement sur batterie</text><g font-family="Arial" font-size="22" text-anchor="middle" fill="#173e48"><rect x="52" y="125" width="255" height="105" rx="14" fill="#dce9f3"/><text x="180" y="166">Secteur</text><text x="180" y="198">disponible</text><rect x="371" y="125" width="255" height="105" rx="14" fill="#ffebce"/><text x="500" y="166">Coupure :</text><text x="500" y="198">transition</text><rect x="690" y="125" width="255" height="105" rx="14" fill="#d8eee7"/><text x="817" y="166">Alimentation</text><text x="817" y="198">sur batterie</text></g><path d="M309 179h56m-15-12 15 12-15 12M628 179h56m-15-12 15 12-15 12" fill="none" stroke="#56797d" stroke-width="5"/><text x="54" y="286" font-family="Arial" font-size="18" fill="#475e66">La durée de transition dépend du dispositif. Une fonction EPS n'est pas toujours un UPS sans coupure.</text></svg>