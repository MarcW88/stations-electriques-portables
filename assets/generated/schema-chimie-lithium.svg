<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><title>LiFePO4 et autres batteries lithium-ion : familles de cathodes</title><rect width="1000" height="390" rx="20" fill="#f7faf9"/><text x="55" y="55" font-family="Arial" font-size="27" font-weight="bold" fill="#193c47">LiFePO₄ appartient à la famille lithium-ion</text><rect x="55" y="97" width="895" height="235" rx="18" fill="#dae8f3"/><text x="500" y="135" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#26485b">Batteries rechargeables lithium-ion</text><rect x="92" y="168" width="370" height="135" rx="15" fill="#d8eee2"/><rect x="540" y="168" width="370" height="135" rx="15" fill="#f7e4ce"/><g text-anchor="middle" fill="#204853" font-family="Arial"><text x="276" y="216" font-size="28" font-weight="bold">LiFePO₄ (LFP)</text><text x="276" y="250" font-size="20">Cathode phosphate de fer</text><text x="725" y="216" font-size="28" font-weight="bold">Ex. NMC</text><text x="725" y="250" font-size="20">Cathode nickel-manganèse-cobalt</text></g><text x="55" y="366" font-family="Arial" font-size="17" fill="#5e6b72">Comparer aussi densité énergétique, cycles annoncés et conditions de mesure du fabricant.</text></svg>