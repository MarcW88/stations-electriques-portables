<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><title>Notion de cycle de batterie et capacité résiduelle</title><rect width="1000" height="370" rx="20" fill="#f7faf9"/><text x="55" y="56" font-family="Arial" font-size="28" font-weight="bold" fill="#173d48">Cycle de batterie ≠ durée de vie fixe</text><g font-family="Arial" fill="#244654"><rect x="62" y="109" width="260" height="114" rx="16" fill="#e0f0e9"/><text x="192" y="154" font-size="24" font-weight="bold" text-anchor="middle">Énergie cumulée</text><text x="192" y="190" font-size="19" text-anchor="middle">chargée / déchargée</text><rect x="371" y="109" width="260" height="114" rx="16" fill="#e4edf8"/><text x="502" y="154" font-size="24" font-weight="bold" text-anchor="middle">Vieillissement</text><text x="502" y="190" font-size="19" text-anchor="middle">calendaire et cycles</text><rect x="681" y="109" width="260" height="114" rx="16" fill="#fff0d8"/><text x="810" y="154" font-size="24" font-weight="bold" text-anchor="middle">Capacité</text><text x="810" y="190" font-size="19" text-anchor="middle">résiduelle</text></g><path d="M326 166h40m-13-10 13 10-13 10M634 166h42m-13-10 13 10-13 10" fill="none" stroke="#537f80" stroke-width="5"/><text x="62" y="285" font-family="Arial" font-size="19" fill="#425f64">Le seuil annoncé (ex. 80 %) et les conditions d'essai sont indispensables pour comparer les cycles.</text></svg>