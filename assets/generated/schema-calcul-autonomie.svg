<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><title>Calcul de l'autonomie avec l'énergie utilisable et la puissance consommée</title><rect width="1000" height="340" rx="20" fill="#f7faf9"/><text x="45" y="54" font-family="Arial" font-size="27" font-weight="bold" fill="#20434a">Calculer l'autonomie d'une batterie</text><rect x="70" y="102" width="860" height="123" rx="18" fill="#dcecf5"/><text x="500" y="144" font-family="Arial" font-size="25" text-anchor="middle" fill="#174751">Énergie utilisable (Wh)</text><path d="M280 162h440" stroke="#41717a" stroke-width="3"/><text x="500" y="199" font-family="Arial" font-size="25" text-anchor="middle" fill="#174751">Consommation moyenne (W)</text><text x="70" y="270" font-family="Arial" font-size="19" fill="#516a70">Exemple théorique : 850 Wh utiles ÷ 100 W = 8,5 heures.</text></svg>