<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><title>Schéma simplifié des entrées, du stockage et des sorties d'une station électrique</title><rect width="1000" height="370" rx="20" fill="#f7faf9"/><text x="50" y="52" font-family="Arial" font-size="27" font-weight="bold" fill="#1d4851">Fonctionnement d'une station électrique portable</text><g font-family="Arial" font-size="22" fill="#21444b" text-anchor="middle"><rect x="55" y="100" width="220" height="160" rx="16" fill="#dcecf7"/><text x="165" y="148">Entrées</text><text x="165" y="183" font-size="18">Secteur / solaire</text><text x="165" y="214" font-size="18">Voiture (selon modèle)</text><rect x="384" y="100" width="235" height="160" rx="16" fill="#e0f1e7"/><text x="500" y="153">Contrôleur</text><text x="500" y="188">+ batterie (Wh)</text><rect x="725" y="100" width="225" height="160" rx="16" fill="#fff0d8"/><text x="837" y="148">Sorties</text><text x="837" y="183" font-size="18">AC / USB / DC</text><text x="837" y="214" font-size="18">selon modèle</text></g><g fill="none" stroke="#537d84" stroke-width="5"><path d="M279 179h98m-14-12 14 12-14 12M621 179h97m-14-12 14 12-14 12"/></g><text x="50" y="325" font-family="Arial" font-size="18" fill="#52696b">L'onduleur assure la conversion pour les prises secteur. Des pertes existent à chaque étape.</text></svg>