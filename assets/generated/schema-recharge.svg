<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350"><title>Estimer le temps idéal de recharge avec les wattheures et la puissance moyenne reçue</title><rect width="1000" height="350" rx="20" fill="#f7faf9"/><text x="45" y="56" font-family="Arial" font-size="27" font-weight="bold" fill="#1e454d">Durée de charge : ordre de grandeur idéal</text><rect x="70" y="106" width="860" height="126" rx="18" fill="#e2f1eb"/><text x="500" y="150" font-family="Arial" font-size="25" fill="#194b50" text-anchor="middle">Énergie à recharger (Wh)</text><path d="M285 170h430" stroke="#1b615f" stroke-width="3"/><text x="500" y="206" font-family="Arial" font-size="25" fill="#194b50" text-anchor="middle">Puissance moyenne effectivement reçue (W)</text><text x="70" y="277" font-family="Arial" font-size="19" fill="#496066">Exemple : 500 Wh ÷ 100 W = 5 h idéales, avant pertes et ralentissement de charge.</text></svg>