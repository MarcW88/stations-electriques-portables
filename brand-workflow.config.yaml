project:
  name: "stations-electriques-portables"
  domain: "https://stations-electriques-portables.fr"
  language: "fr"

content:
  scope:
    - "/marques/"
  source_of_truth: "_generate.py + _generate_brands.py"
  mode: "new_content"

quality:
  quality_reference: "/marques/ecoflow/"
  draft_robots: "noindex, follow"

routing:
  page_types:
    - BRAND_HUB
    - PRODUCT
    - REVIEW
    - SERVICE
    - ACCESSORY_HUB
    - ALTERNATIVES

entities:
  require_entity_map: true
  require_current_range: true
  require_ecosystem_map: true
  require_brand_positioning: true

evidence:
  prefer_primary_sources: true
  statuses:
    - VERIFIED
    - SUPPORTED
    - INFERRED
    - UNKNOWN
    - OUTDATED
    - CONTRADICTED

internal_linking:
  required_paths:
    - "/comparatifs/"
    - "/guides/"
    - "/usages/"
  minimum_contextual_links: 8
  minimum_unique_targets: 6
  require_product_link_on_brand_hub: true
  require_comparison_link_when_relevant: true

workflow:
  brands_dir: ".content/brands"
  brand_pages_dir: ".content/brand-pages"
  briefs_dir: ".content/briefs"
  reviews_dir: ".content/reviews"
  require_human_validation_before_publish: true
  allow_automatic_merge: false

quality_gate:
  minimum_h2_brand_hub: 9
  minimum_words_brand_hub: 1000
  minimum_sources: 3
  require_limit_section: true
  require_choose_avoid: true
  require_noindex_in_draft: true

known_exceptions:
  izywatt:
    internal_product_page: false
    reason: "Aucune fiche modèle IZYWATT n'existe encore dans le repo; ne pas inventer une URL produit."
